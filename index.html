<!DOCTYPE html>
<html lang="id" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriBot - AI Chatbot Gizi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            light: '#3b82f6',
                            dark: '#60a5fa'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-bubble {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .typing-dots {
            display: inline-flex;
            align-items: center;
        }

        .typing-dots span {
            height: 8px;
            width: 8px;
            background-color: #9ca3af;
            border-radius: 50%;
            display: inline-block;
            margin: 0 1px;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes typing {

            0%,
            80%,
            100% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .dark .input-container {
            background: #1f2937;
            border-color: #374151;
        }

        .input-container {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            transition: all 0.2s ease;
        }

        .input-container:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .dark .input-container:focus-within {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }

        .upload-btn {
            transition: all 0.2s ease;
        }

        .upload-btn:hover {
            background-color: #f3f4f6;
            transform: scale(1.05);
        }

        .dark .upload-btn:hover {
            background-color: #374151;
        }

        .send-btn {
            transition: all 0.2s ease;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message-content img {
            border-radius: 12px;
            max-width: 300px;
            max-height: 200px;
            object-fit: cover;
        }

        .nutrition-card {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 1px solid #bae6fd;
        }

        .dark .nutrition-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border: 1px solid #1e40af;
        }

        .scroll-smooth {
            scroll-behavior: smooth;
        }

        /* Theme toggle animation */
        .theme-toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .theme-toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .theme-toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #e5e7eb;
            transition: .4s;
            border-radius: 24px;
        }

        .theme-toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.theme-toggle-slider {
            background-color: #3b82f6;
        }

        input:checked+.theme-toggle-slider:before {
            transform: translateX(26px);
        }

        .theme-toggle-icons {
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
            line-height: 24px;
        }

        .theme-toggle-icons svg {
            width: 14px;
            height: 14px;
            margin-top: 5px;
            color: white;
        }

        /* Add dark mode overrides for colored cards */
        .dark .bg-blue-50 {
            background-color: rgba(30, 58, 138, 0.3);
        }

        .dark .border-blue-200 {
            border-color: #1e40af;
        }

        .dark .text-blue-900,
        .dark .text-blue-800,
        .dark .text-blue-600 {
            color: #93c5fd;
        }

        .dark .bg-green-50 {
            background-color: rgba(20, 83, 45, 0.3);
        }

        .dark .border-green-200 {
            border-color: #166534;
        }

        .dark .text-green-900,
        .dark .text-green-800,
        .dark .text-green-700 {
            color: #86efac;
        }

        .dark .bg-yellow-50 {
            background-color: rgba(113, 63, 18, 0.3);
        }

        .dark .border-yellow-200 {
            border-color: #854d0e;
        }

        .dark .text-yellow-800 {
            color: #fde047;
        }

        .dark .bg-white\/50 {
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900">
    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div
                        class="w-10 h-10 bg-gradient-to-r from-emerald-500 to-blue-500 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-semibold text-gray-900 dark:text-white">NutriBot</h1>
                        <p class="text-sm text-gray-500 dark:text-gray-400">AI Analisis Gizi Makanan</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <!-- Theme Toggle -->
                    <label class="theme-toggle-switch">
                        <input type="checkbox" id="themeToggle">
                        <div class="theme-toggle-slider">
                            <div class="theme-toggle-icons">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                                    class="sun">
                                    <path
                                        d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z" />
                                </svg>
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                                    class="moon">
                                    <path fill-rule="evenodd"
                                        d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"
                                        clip-rule="evenodd" />
                                </svg>
                            </div>
                        </div>
                    </label>
                    <!-- Online Status -->
                    <div class="flex items-center space-x-2">
                        <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                        <span class="text-sm text-gray-600 dark:text-gray-300">Online</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-6 flex flex-col">
        <!-- Messages Area -->
        <div id="chatMessages" class="flex-1 overflow-y-auto space-y-6 mb-6 scroll-smooth min-h-[calc(100vh-240px)]">
            <!-- Welcome Message -->
            <div class="flex items-start space-x-3 chat-bubble">
                <div
                    class="w-8 h-8 bg-gradient-to-r from-emerald-500 to-blue-500 rounded-full flex items-center justify-center flex-shrink-0">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z">
                        </path>
                    </svg>
                </div>
                <div
                    class="message-content bg-white dark:bg-gray-800 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-gray-100 dark:border-gray-700 max-w-2xl">
                    <p class="text-gray-800 dark:text-gray-200 mb-3">Halo! Saya NutriBot, asisten AI untuk analisis gizi
                        makanan. 👋
                    </p>
                    <div class="space-y-2 text-sm text-gray-600 dark:text-gray-400">
                        <div class="flex items-center space-x-2">
                            <span class="text-blue-500">📸</span>
                            <span>Upload foto makanan untuk analisis nutrisi</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-green-500">💬</span>
                            <span>Tanya seputar gizi dan pola makan sehat</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-purple-500">🥗</span>
                            <span>Dapatkan rekomendasi menu bergizi</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="sticky bottom-0 bg-gray-50 dark:bg-gray-900 pt-4 mt-auto">
            <div class="input-container flex items-end space-x-3 p-2">
                <!-- Upload Button -->
                <button id="uploadBtn"
                    class="upload-btn p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                    <svg class="w-6 h-6 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13">
                        </path>
                    </svg>
                </button>
                <input type="file" id="imageInput" accept="image/*" class="hidden">

                <!-- Text Input -->
                <div class="flex-1 min-h-[44px] max-h-32 overflow-y-auto">
                    <textarea id="messageInput" placeholder="Tanyakan tentang gizi makanan atau upload foto..."
                        class="w-full resize-none border-0 bg-transparent px-3 py-2 text-gray-900 dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-0"
                        rows="1"></textarea>
                </div>

                <!-- Send Button -->
                <button id="sendBtn"
                    class="send-btn p-2 bg-blue-500 text-white rounded-full hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </div>

            <!-- Image Preview -->
            <div id="imagePreview"
                class="hidden mt-3 p-3 bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 rounded-xl">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <img id="previewImg" class="w-12 h-12 object-cover rounded-lg">
                        <div>
                            <p class="text-sm font-medium text-blue-900 dark:text-blue-200">Foto siap dianalisis</p>
                            <p class="text-xs text-blue-600 dark:text-blue-300">Klik kirim untuk memulai analisis</p>
                        </div>
                    </div>
                    <button id="removeImg"
                        class="text-blue-500 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-200 p-1">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Theme toggle functionality
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;

            // Check for saved theme preference or use user's system preference
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                html.classList.add('dark');
                themeToggle.checked = true;
            }

            // Toggle theme when the switch is clicked
            themeToggle.addEventListener('change', () => {
                if (themeToggle.checked) {
                    html.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    html.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            });

        });
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        const removeImg = document.getElementById('removeImg');

        let uploadedImage = null;

        // Sample nutrition database
        const nutritionData = {
            'nasi': { kalori: 130, protein: 2.7, karbohidrat: 28, lemak: 0.3, serat: 0.4 },
            'ayam': { kalori: 165, protein: 31, karbohidrat: 0, lemak: 3.6, serat: 0 },
            'sayur': { kalori: 25, protein: 2, karbohidrat: 5, lemak: 0.2, serat: 2.6 },
            'ikan': { kalori: 206, protein: 22, karbohidrat: 0, lemak: 12, serat: 0 },
            'telur': { kalori: 155, protein: 13, karbohidrat: 1.1, lemak: 11, serat: 0 },
            'buah': { kalori: 52, protein: 0.3, karbohidrat: 14, lemak: 0.2, serat: 2.4 },
            'tahu': { kalori: 76, protein: 8, karbohidrat: 1.9, lemak: 4.8, serat: 0.4 },
            'tempe': { kalori: 193, protein: 19, karbohidrat: 9, lemak: 11, serat: 9 }
        };

        // Auto-resize textarea
        messageInput.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 128) + 'px';
            updateSendButton();
        });

        function updateSendButton() {
            const hasText = messageInput.value.trim().length > 0;
            const hasImage = uploadedImage !== null;
            sendBtn.disabled = !hasText && !hasImage;
        }

        // Upload functionality
        uploadBtn.addEventListener('click', () => imageInput.click());

        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleImageUpload(e.target.files[0]);
            }
        });

        removeImg.addEventListener('click', clearImagePreview);

        function handleImageUpload(file) {
            if (!file.type.startsWith('image/')) {
                alert('Mohon upload file gambar yang valid');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                imagePreview.classList.remove('hidden');
                uploadedImage = file;
                updateSendButton();
            };
            reader.readAsDataURL(file);
        }

        function clearImagePreview() {
            imagePreview.classList.add('hidden');
            uploadedImage = null;
            imageInput.value = '';
            updateSendButton();
        }

        function addMessage(content, isUser = false, isImage = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-start space-x-3 chat-bubble ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            if (!isUser) {
                const avatar = document.createElement('div');
                avatar.className = 'w-8 h-8 bg-gradient-to-r from-emerald-500 to-blue-500 rounded-full flex items-center justify-center flex-shrink-0';
                avatar.innerHTML = `
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                    </svg>
                `;
                messageDiv.appendChild(avatar);
            }

            const bubble = document.createElement('div');
            bubble.className = `message-content rounded-2xl px-4 py-3 shadow-sm max-w-2xl ${isUser
                ? 'bg-blue-500 text-white rounded-tr-sm ml-auto'
                : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 rounded-tl-sm border border-gray-100 dark:border-gray-700'
                }`;

            if (isImage) {
                const img = document.createElement('img');
                img.src = content;
                img.className = 'max-w-full h-48 object-cover rounded-lg mb-2';
                bubble.appendChild(img);
                if (isUser) {
                    const text = document.createElement('p');
                    text.className = 'text-sm opacity-90';
                    text.textContent = 'Mohon analisis kandungan gizi makanan ini';
                    bubble.appendChild(text);
                }
            } else {
                bubble.innerHTML = content;
            }

            messageDiv.appendChild(bubble);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'flex items-start space-x-3 chat-bubble';
            typingDiv.innerHTML = `
                <div class="w-8 h-8 bg-gradient-to-r from-emerald-500 to-blue-500 rounded-full flex items-center justify-center flex-shrink-0">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                    </svg>
                </div>
                <div class="message-content bg-white dark:bg-gray-800 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-gray-100 dark:border-gray-700">
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function simulateYOLODetection() {
            const possibleFoods = [
                ['nasi', 'ayam', 'sayur'],
                ['ikan', 'nasi', 'tempe'],
                ['telur', 'sayur', 'tahu'],
                ['buah', 'nasi'],
                ['ayam', 'sayur', 'nasi', 'tempe']
            ];
            return possibleFoods[Math.floor(Math.random() * possibleFoods.length)];
        }

        function generateNutritionResponse(detectedFoods) {
            let totalNutrition = { kalori: 0, protein: 0, karbohidrat: 0, lemak: 0, serat: 0 };
            let foodDetails = [];

            detectedFoods.forEach(food => {
                if (nutritionData[food]) {
                    const nutrition = nutritionData[food];
                    totalNutrition.kalori += nutrition.kalori;
                    totalNutrition.protein += nutrition.protein;
                    totalNutrition.karbohidrat += nutrition.karbohidrat;
                    totalNutrition.lemak += nutrition.lemak;
                    totalNutrition.serat += nutrition.serat;

                    const foodName = food.charAt(0).toUpperCase() + food.slice(1);
                    foodDetails.push(`<span class="inline-block bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 px-2 py-1 rounded-full text-xs font-medium mr-1 mb-1">${foodName}</span>`);
                }
            });

            const suggestions = generateSuggestions(totalNutrition);

            return `
                <div class="space-y-4">
                    <div>
                        <p class="font-semibold text-gray-800 dark:text-gray-200 mb-2">🔍 Makanan Terdeteksi:</p>
                        <div class="flex flex-wrap">
                            ${foodDetails.join('')}
                        </div>
                    </div>
                    
                    <div class="nutrition-card p-4 rounded-xl">
                        <p class="font-semibold text-gray-800 dark:text-gray-200 mb-3 flex items-center">
                            <span class="mr-2">📊</span>
                            Informasi Gizi (per porsi)
                        </p>
                        <div class="grid grid-cols-2 gap-3 text-sm">
                            <div class="flex items-center justify-between bg-white/50 dark:bg-white/10 p-2 rounded-lg">
                                <span class="flex items-center text-gray-700 dark:text-gray-300"><span class="mr-1">🔥</span> Kalori</span>
                                <span class="font-semibold text-gray-800 dark:text-gray-200">${Math.round(totalNutrition.kalori)} kcal</span>
                            </div>
                            <div class="flex items-center justify-between bg-white/50 dark:bg-white/10 p-2 rounded-lg">
                                <span class="flex items-center text-gray-700 dark:text-gray-300"><span class="mr-1">🥩</span> Protein</span>
                                <span class="font-semibold text-gray-800 dark:text-gray-200">${totalNutrition.protein.toFixed(1)}g</span>
                            </div>
                            <div class="flex items-center justify-between bg-white/50 dark:bg-white/10 p-2 rounded-lg">
                                <span class="flex items-center text-gray-700 dark:text-gray-300"><span class="mr-1">🍞</span> Karbohidrat</span>
                                <span class="font-semibold text-gray-800 dark:text-gray-200">${totalNutrition.karbohidrat.toFixed(1)}g</span>
                            </div>
                            <div class="flex items-center justify-between bg-white/50 dark:bg-white/10 p-2 rounded-lg">
                                <span class="flex items-center text-gray-700 dark:text-gray-300"><span class="mr-1">🧈</span> Lemak</span>
                                <span class="font-semibold text-gray-800 dark:text-gray-200">${totalNutrition.lemak.toFixed(1)}g</span>
                            </div>
                        </div>
                        ${totalNutrition.serat > 0 ? `
                            <div class="mt-2">
                                <div class="flex items-center justify-between bg-white/50 dark:bg-white/10 p-2 rounded-lg text-sm">
                                    <span class="flex items-center text-gray-700 dark:text-gray-300"><span class="mr-1">🌾</span> Serat</span>
                                    <span class="font-semibold text-gray-800 dark:text-gray-200">${totalNutrition.serat.toFixed(1)}g</span>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-800 p-4 rounded-xl">
                        <p class="font-semibold text-green-800 dark:text-green-200 mb-2 flex items-center">
                            <span class="mr-2">💡</span>
                            Saran Nutrisi
                        </p>
                        <p class="text-green-700 dark:text-green-300 text-sm">${suggestions}</p>
                    </div>
                </div>
            `;
        }

        function generateSuggestions(nutrition) {
            const suggestions = [];

            if (nutrition.kalori > 600) {
                suggestions.push("Porsi cukup besar, cocok untuk makan utama");
            } else if (nutrition.kalori < 200) {
                suggestions.push("Porsi kecil, bisa ditambah buah atau kacang-kacangan");
            }

            if (nutrition.protein > 20) {
                suggestions.push("Kandungan protein tinggi, baik untuk pembentukan otot");
            } else if (nutrition.protein < 10) {
                suggestions.push("Protein kurang, tambahkan telur, ikan, atau tahu/tempe");
            }

            if (nutrition.serat > 5) {
                suggestions.push("Serat tinggi, baik untuk pencernaan");
            } else if (nutrition.serat < 2) {
                suggestions.push("Tambahkan sayuran hijau untuk meningkatkan serat");
            }

            suggestions.push("Jangan lupa minum air putih minimal 8 gelas sehari");

            return suggestions.join(". ") + ".";
        }

        function handleTextMessage(message) {
            const lowerMessage = message.toLowerCase();

            if (lowerMessage.includes('kalori') || lowerMessage.includes('gizi') || lowerMessage.includes('nutrisi')) {
                return `
                    <p class="mb-3">Saya siap membantu analisis gizi makanan Anda! 📊</p>
                    <div class="bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 p-3 rounded-xl">
                        <p class="font-medium text-blue-900 dark:text-blue-200 mb-2">Yang bisa saya lakukan:</p>
                        <div class="space-y-2 text-sm text-blue-800 dark:text-blue-300">
                            <div class="flex items-center space-x-2">
                                <span>🔍</span>
                                <span>Deteksi makanan dengan teknologi YOLO AI</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span>📊</span>
                                <span>Analisis kalori, protein, karbohidrat, lemak & serat</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span>💡</span>
                                <span>Berikan saran nutrisi yang personal</span>
                            </div>
                        </div>
                    </div>
                    <p class="mt-3 text-sm text-gray-600 dark:text-gray-400">Upload foto makanan dengan klik icon 📎 di sebelah input!</p>
                `;
            } else if (lowerMessage.includes('sehat') || lowerMessage.includes('diet')) {
                return `
                    <p class="mb-3">Berikut panduan pola makan sehat: 🥗</p>
                    <div class="space-y-3">
                        <div class="bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-800 p-3 rounded-xl">
                            <p class="font-medium text-green-900 dark:text-green-200 mb-2">Prinsip Gizi Seimbang:</p>
                            <div class="space-y-2 text-sm text-green-800 dark:text-green-300">
                                <div class="flex items-start space-x-2">
                                    <span class="mt-0.5">🥬</span>
                                    <span>Sayur & buah: 5-9 porsi per hari (setengah piring)</span>
                                </div>
                                <div class="flex items-start space-x-2">
                                    <span class="mt-0.5">🍚</span>
                                    <span>Karbohidrat: 3-8 porsi (seperempat piring)</span>
                                </div>
                                <div class="flex items-start space-x-2">
                                    <span class="mt-0.5">🥩</span>
                                    <span>Protein: 2-4 porsi (seperempat piring)</span>
                                </div>
                                <div class="flex items-start space-x-2">
                                    <span class="mt-0.5">💧</span>
                                    <span>Air putih: minimal 8 gelas per hari</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p class="mt-3 text-sm text-gray-600 dark:text-gray-400">Upload foto makanan Anda untuk analisis gizi yang lebih detail!</p>
                `;
            } else if (lowerMessage.includes('halo') || lowerMessage.includes('hai') || lowerMessage.includes('hello')) {
                return `
                    <p class="mb-3">Halo! Senang bertemu dengan Anda! 👋</p>
                    <p class="mb-3">Saya NutriBot, asisten AI yang akan membantu Anda memahami kandungan gizi makanan.</p>
                    <div class="bg-gradient-to-r from-blue-50 to-green-50 dark:from-blue-900/30 dark:to-green-900/30 border border-blue-200 dark:border-blue-800 p-3 rounded-xl">
                        <p class="font-medium text-gray-800 dark:text-gray-200 mb-2">Mulai dengan:</p>
                        <div class="space-y-1 text-sm text-gray-700 dark:text-gray-300">
                            <p>📸 Upload foto makanan untuk analisis instan</p>
                            <p>💬 Tanya tentang tips gizi dan pola makan sehat</p>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <p class="mb-3">Terima kasih atas pertanyaannya! 😊</p>
                    <p class="mb-3">Saya adalah NutriBot yang khusus membantu analisis gizi makanan dan memberikan saran nutrisi.</p>
                    <div class="bg-yellow-50 dark:bg-yellow-900/30 border border-yellow-200 dark:border-yellow-800 p-3 rounded-xl">
                        <p class="text-yellow-800 dark:text-yellow-200 text-sm">
                            <span class="font-medium">💡 Tips:</span> 
                            Upload foto makanan atau tanyakan seputar "gizi", "kalori", "nutrisi", atau "diet" untuk mendapatkan informasi yang lebih spesifik!
                        </p>
                    </div>
                `;
            }
        }

        async function processMessage() {
            const message = messageInput.value.trim();

            if (!message && !uploadedImage) return;

            // Add user message
            if (message) {
                addMessage(message, true);
            }

            // Add uploaded image
            if (uploadedImage) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    addMessage(e.target.result, true, true);
                };
                reader.readAsDataURL(uploadedImage);
            }

            messageInput.value = '';
            messageInput.style.height = 'auto';
            showTypingIndicator();

            // Simulate processing delay
            setTimeout(() => {
                removeTypingIndicator();

                if (uploadedImage) {
                    // Simulate YOLO detection and LLM analysis
                    const detectedFoods = simulateYOLODetection();
                    const nutritionResponse = generateNutritionResponse(detectedFoods);
                    addMessage(nutritionResponse);
                    clearImagePreview();
                } else {
                    // Handle text-only message
                    const response = handleTextMessage(message);
                    addMessage(response);
                }
            }, 1500 + Math.random() * 1000);
        }

        // Event listeners
        sendBtn.addEventListener('click', processMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                processMessage();
            }
        });

        // Initialize
        updateSendButton();
    </script>
</body>

</html>
